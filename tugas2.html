<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Latihan 2 - Nilai Akhir</title>
</head>
<body>
    <h2>Perhitungan Nilai Akhir</h2>

    <script>
        function hitungNilaiAkhir(tugas, uts, uas){
            return (tugas * 0.4) + (uts * 0.3) + (uas * 0.3);
        }

        function getGrade(nilai){
            if(nilai >= 85) {
                return "A";
            } else if(nilai >= 80){
                return "A-";
            } else if(nilai >= 75){
                return "B+";
            } else if(nilai >= 70) {
                return "B";
            } else if(nilai >= 65){
                return "B-";
            } else if(nilai >= 60){
                return "C+";
            } else if(nilai >= 55){
                return "C";
            }
            else if(nilai >= 45){
                return "D";
            } else if(nilai >= 0 && nilai < 45){
                return "E";
            } else{
                return "F";
            }
        }

        jumlahMhs = Number(window.prompt("Jumlah"));

        for(i=1; i<=jumlahMhs; i++){
            nama = window.prompt('Nama');
            tugas = Number(window.prompt('Tugas'));
            uts = Number(window.prompt('UTS'));
            uas = Number(window.prompt('UAS'));

            var nilaiAkhir = hitungNilaiAkhir(tugas, uts, uas);

            document.write(i + ". " + nama + "<br>");
            document.write("Tugas: " + tugas);
            document.write("<br />UTS: " + uts);
            document.write("<br />UAS: " + uas);
            document.write("<br />Nilai Akhir: " + nilaiAkhir);
            document.write("<br />Grade: " + getGrade(nilaiAkhir) + "<br /><br />");
        }

        alert("Klik OK untuk kembali ke halaman utama");
        window.location.href = "index.html";
    </script>
</body>
</html>
