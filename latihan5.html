<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 5 - Bilangan Ganjil</title>
</head>
<body>
    <script>
        angka = Number(window.prompt("Masukkan angka"));

        document.write("Bilangan ganjil dari 1 sampai " + angka + ":<br>");

        for(i=1; i<=angka; i++){
            if(i % 2 !== 0){
                document.write(i + " ");
            }
        }
    </script>
</body>
</html>
