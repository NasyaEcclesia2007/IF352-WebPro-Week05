<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 4 - Luas & Keliling</title>
</head>
<body>
    <script>
        var pilihan;

        do {
            pilihan = window.prompt("Hitung apa? (luas/keliling)").toLowerCase();
        } while(pilihan !== "luas" && pilihan !== "keliling");

        panjang = Number(window.prompt("Panjang"));
        lebar = Number(window.prompt("Lebar"));

        function hitungLuas(p, l){
            return p * l;
        }

        function hitungKeliling(p, l){
            return 2 * (p + l);
        }

        if(pilihan === "luas"){
            document.write("Luas: " + hitungLuas(panjang, lebar));
        } else {
            document.write("Keliling: " + hitungKeliling(panjang, lebar));
        }

        document.write("<br /><br /><button onclick=\"window.location.href='index.html'\">Kembali ke Home</button>");
    </script>
</body>
</html>
