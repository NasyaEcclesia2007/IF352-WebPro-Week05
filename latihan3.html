<!DOCTYPE html>
<html>
    <head>
        <title>Latihan 3 - Jam</title>
    </head>
    <body>
        <script>
            jam = Number(window.prompt("Jam Sekarang"));

            function getJam(jam) {
                if(jam >= 6 && jam <=10){
                    return "Selamat Pagi";
                }else if(jam >= 11 && jam <= 14){
                    return "Selamat Siang";
                }else if(jam >= 15 && jam <= 17){
                    return "Selamat Sore";
                }else if(jam >= 18 && jam <= 22){
                    return "Selamat Malam";
                }else if(jam >= 23 || jam <= 5){
                    return "Selamat Tidur";
                }
            }

            document.write(getJam(jam));
        </script>
    </body>
</html>
